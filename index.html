<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nEbula Grid</title>
    <style>
        /* RESET & BASE STYLES */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #0f0f13; /* Deep dark bg like the example */
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* CONTAINER */
        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* SEARCH BAR STYLES (The Purple/Blue Look) */
        .search-container {
            width: 100%;
            position: relative;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            border-radius: 9999px; /* Fully rounded pill shape */
            border: 2px solid #3d3d45;
            background-color: #1a1a20;
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #8b5cf6; /* Purple glow */
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #8b5cf6; /* Purple icon */
            cursor: pointer;
            font-size: 20px;
        }

        /* GRID CARDS STYLES (The Squares) */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            width: 100%;
            margin-top: 20px;
        }

        .card {
            background-color: #1a1a20;
            border-radius: 16px; /* Soft rounded corners */
            padding: 24px;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 150px;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: #8b5cf6; /* Purple hover effect */
            background-color: #23232d;
        }

        .card h3 {
            font-size: 18px;
            color: #fff;
            pointer-events: none; /* Prevents text from interfering with click */
        }

        /* PROXY CLOAK STYLES (Hidden by default) */
        #proxy-cloak {
            display: none !important; /* Hidden until triggered */
            width: 100vw;
            height: 100vh;
            border: none;
        }

    </style>
</head>
<body>

    <div class="container">
        
        <!-- SEARCH BAR SECTION -->
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search games..." autocomplete="off">
            <span class="search-icon" onclick="triggerProxy()">🔍</span>
        </div>

        <!-- GRID OF CARDS (The Squares) -->
        <div class="grid">
            <!-- Card 1: Browse/Play -->
            <div class="card" onclick="triggerProxy()">
                <h3>▶ Play Games</h3>
            </div>
            
            <!-- Card 2: Watch (Example) -->
            <div class="card">
                <h3>▶ Watch</h3>
            </div>

            <!-- Card 3: Files -->
            <div class="card">
                <h3>📂 UGS Files</h3>
            </div>
        </div>

    </div>

    <!-- THE MAGIC PROXY CLOAK -->
    <iframe id="proxy-cloak" src="https://web-production-4197f.up.railway.app/" allowfullscreen></iframe>

    <script>
        function triggerProxy() {
            const cloak = document.getElementById('proxy-cloak');
            
            // 1. Show the iframe immediately
            cloak.style.display = 'block';

            // 2. Remove padding/margin from body to fill screen perfectly
            document.body.style.padding = '0';
            document.body.style.margin = '0';
        }

        // Optional: Trigger on Enter key press in search box
        document.getElementById('searchInput').addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                triggerProxy();
            }
        });
    </script>

</body>
</html>
